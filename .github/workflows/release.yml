name: Release Skill ZIP

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from _meta.json
        id: version
        run: |
          VERSION=$(jq -r '.version' aimeet/_meta.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: version field not found in aimeet/_meta.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "ERROR: Release $TAG already exists. Bump the version in aimeet/_meta.json before pushing."
            exit 1
          fi

      - name: Create ZIP
        run: zip -r aimeet.zip aimeet/

      - name: Create versioned release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            aimeet.zip \
            --title "aimeet ${{ steps.version.outputs.tag }}" \
            --notes "Install by downloading \`aimeet.zip\` and extracting the \`aimeet/\` folder into your OpenClaw skills directory. Full docs at https://aimeet.live/docs/openclaw" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
